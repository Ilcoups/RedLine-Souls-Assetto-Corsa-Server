<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedLine Souls - Live Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { 
            color: #ff4500;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .player-count {
            font-size: 3em;
            font-weight: bold;
            color: #ff4500;
            text-align: center;
            margin: 20px 0;
        }
        .player-list {
            display: grid;
            gap: 10px;
        }
        .player {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        .car { 
            color: #aaa;
            font-size: 0.9em;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .stat-label { color: #aaa; }
        .stat-value { 
            color: #ff4500;
            font-weight: bold;
        }
        .updated {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏁 RedLine Souls</h1>
        
        <div class="status-card">
            <div class="status-header">
                <h2>Server Status</h2>
                <div class="status-dot" id="status"></div>
            </div>
            <div class="player-count" id="count">-</div>
            <div style="text-align: center; color: #aaa;">Players Online</div>
        </div>

        <div class="status-card" id="players-card" style="display: none;">
            <h2 style="margin-bottom: 15px;">Currently Racing</h2>
            <div class="player-list" id="players"></div>
        </div>

        <div class="status-card">
            <h2 style="margin-bottom: 15px;">Today's Stats</h2>
            <div class="stat-row">
                <span class="stat-label">Unique Players</span>
                <span class="stat-value" id="unique">-</span>
            </div>
            <div class="stat-row" style="border: none;">
                <span class="stat-label">Total Crashes</span>
                <span class="stat-value" id="crashes">-</span>
            </div>
        </div>

        <div class="updated" id="updated">Loading...</div>
    </div>

    <script>
        async function updateStatus() {
            try {
                const res = await fetch('/status.json');
                const data = await res.json();
                
                document.getElementById('count').textContent = data.online.count;
                document.getElementById('unique').textContent = data.today.unique_players;
                document.getElementById('crashes').textContent = data.today.total_crashes;
                
                const playersDiv = document.getElementById('players');
                const playersCard = document.getElementById('players-card');
                
                if (data.online.count > 0) {
                    playersCard.style.display = 'block';
                    playersDiv.innerHTML = data.online.players.map(p => `
                        <div class="player">
                            <span>${p.name}</span>
                            <span class="car">${p.car.replace(/_/g, ' ')}</span>
                        </div>
                    `).join('');
                } else {
                    playersCard.style.display = 'none';
                }
                
                const time = new Date(data.timestamp).toLocaleTimeString();
                document.getElementById('updated').textContent = `Last updated: ${time}`;
            } catch (e) {
                console.error('Failed to load status', e);
            }
        }
        
        updateStatus();
        setInterval(updateStatus, 10000); // Update every 10 seconds
    </script>
</body>
</html>
