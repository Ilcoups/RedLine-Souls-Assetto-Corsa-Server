  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\n\nWelcome to the most immersive Shuto Revival Project\ncruise server! Drive\
  \ through Tokyo's highways with\ndynamic AI traffic that changes throughout the\
  \ day.\n\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\n\n\U0001F4CB REQUIREMENTS\n\u2705 Shutoko Revival Project 0.9.3\n\u2705\
  \ Content Manager v0.8.2594+\n\u2705 CSP 0.2.0+ (CSP 0.1.78+ minimum)\n\nGet CSP:\
  \ https://acstuff.ru/patch/\n\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\n\n\U0001F306 DYNAMIC TRAFFIC SYSTEM\nTraffic density\
  \ & behavior changes every 6 hours!\n\n\U0001F319 Night (00:00-06:00)\n\u2022 Light\
  \ traffic, chill vibes\n\u2022 Perfect for scenic cruising\n\n\u2600\uFE0F Morning\
  \ (06:00-12:00)\n\u2022 Rush hour! Dense & aggressive\n\u2022 Test your skills in\
  \ traffic\n\n\U0001F324\uFE0F Afternoon (12:00-18:00)\n\u2022 Balanced flow, steady\
  \ pace\n\u2022 Great for exploring\n\n\U0001F306 Evening (18:00-00:00)\n\u2022 Highway\
  \ battles, push hard!\n\u2022 Most intense traffic\n\n\U0001F3AE Weekend Specials:\
  \ Different traffic patterns\nevery Saturday & Sunday!\n\n\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\n\u2728 SERVER FEATURES\n\
  \u2022 \U0001F697 70+ AI cars per player (up to 250 total!)\n\u2022 \U0001F324\uFE0F\
  \ Dynamic weather & day/night cycle\n\u2022 \U0001F4CD 157 teleport locations (C1,\
  \ Wangan, Yokohane, etc.)\n\u2022 \U0001F4CA Daily leaderboards (speed, playtime,\
  \ clean driving)\n\u2022 \U0001F38C Tokyo-authentic traffic behavior\n\u2022 \u26A1\
  \ High-performance server (60 Hz tick rate)\n\u2022 \U0001F504 AI traffic respects\
  \ Heiwajima PA pit area\n\u2022 \U0001F4AC Active Discord community\n\n\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\n\U0001F4E2\
  \ JOIN OUR COMMUNITY\nDiscord: https://discord.gg/YJJEGAhf\n\u2022 Daily leaderboards\n\
  \u2022 Server updates & events\n\u2022 Community races\n\u2022 Get help & share\
  \ clips\n\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\n\n\u26A0\uFE0F IMPORTANT TIPS\n\u2022 Disable pit limiter after spawning\
  \ (CTRL+P)\n\u2022 Use teleports: ESC \u2192 Teleports menu (157 locations!)\n\u2022\
  \ First join may take 10-20 seconds (AI spawning)\n\u2022 You spawn at Heiwajima\
  \ PA (parking area)\n\u2022 Recommended cars: GT-R, GT86, M3 E92\n\u2022 Respect\
  \ other drivers - this isn't a demolition derby!\n\u2022 AFK kick after 20 minutes\n\
  \n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\n\n\U0001F4DC SERVER RULES\n1\uFE0F\u20E3 No intentional ramming or blocking\n\
  2\uFE0F\u20E3 Respect the pit area (Heiwajima PA)\n3\uFE0F\u20E3 Push hard, but\
  \ drive smart\n4\uFE0F\u20E3 Have fun - it's a cruise server!\n\n\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\
  \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\nSee you on\
  \ the Wangan! \U0001F3C1\nKeep it sideways, keep it stylish \U0001F38C"
