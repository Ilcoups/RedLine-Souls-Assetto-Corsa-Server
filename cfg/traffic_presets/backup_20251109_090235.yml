ServerDescription: "🏎️ REDLINE SOULS - TOKYO HIGHWAY CRUISE 🎌\n\
  \n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  Welcome to the most immersive Shuto Revival Project\n\
  cruise server! Drive through Tokyo's highways with\n\
  dynamic AI traffic that changes throughout the day.\n\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  📋 REQUIREMENTS\n\
  ✅ Shutoko Revival Project 0.9.3\n\
  ✅ Content Manager v0.8.2594+\n\
  ✅ CSP 0.2.0+ (CSP 0.1.78+ minimum)\n\n\
  Get CSP: https://acstuff.ru/patch/\n\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  🌆 DYNAMIC TRAFFIC SYSTEM\n\
  Traffic density & behavior changes every 6 hours!\n\n\
  🌙 Night (00:00-06:00)\n\
     • Light traffic, chill vibes\n\
     • Perfect for scenic cruising\n\n\
  ☀️ Morning (06:00-12:00)\n\
     • Rush hour! Dense & aggressive\n\
     • Test your skills in traffic\n\n\
  🌤️ Afternoon (12:00-18:00)\n\
     • Balanced flow, steady pace\n\
     • Great for exploring\n\n\
  🌆 Evening (18:00-00:00)\n\
     • Highway battles, push hard!\n\
     • Most intense traffic\n\n\
  🎮 Weekend Specials: Different traffic patterns\n\
     every Saturday & Sunday!\n\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  ✨ SERVER FEATURES\n\
  • 🚗 70+ AI cars per player (up to 250 total!)\n\
  • 🌤️ Dynamic weather & day/night cycle\n\
  • 📍 157 teleport locations (C1, Wangan, Yokohane, etc.)\n\
  • 📊 Daily leaderboards (speed, playtime, clean driving)\n\
  • 🎌 Tokyo-authentic traffic behavior\n\
  • ⚡ High-performance server (60 Hz tick rate)\n\
  • 🔄 AI traffic respects Heiwajima PA pit area\n\
  • 💬 Active Discord community\n\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  📢 JOIN OUR COMMUNITY\n\
  Discord: https://discord.gg/YJJEGAhf\n\
  • Daily leaderboards\n\
  • Server updates & events\n\
  • Community races\n\
  • Get help & share clips\n\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  ⚠️ IMPORTANT TIPS\n\
  • Disable pit limiter after spawning (CTRL+P)\n\
  • Use teleports: ESC → Teleports menu (157 locations!)\n\
  • First join may take 10-20 seconds (AI spawning)\n\
  • You spawn at Heiwajima PA (parking area)\n\
  • Recommended cars: GT-R, GT86, M3 E92\n\
  • Respect other drivers - this isn't a demolition derby!\n\
  • AFK kick after 20 minutes\n\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  📜 SERVER RULES\n\
  1️⃣ No intentional ramming or blocking\n\
  2️⃣ Respect the pit area (Heiwajima PA)\n\
  3️⃣ Push hard, but drive smart\n\
  4️⃣ Have fun - it's a cruise server!\n\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n\
  See you on the Wangan! 🏁\n\
  Keep it sideways, keep it stylish 🎌"
