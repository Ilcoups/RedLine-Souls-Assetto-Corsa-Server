server {
    listen 80;
    listen [::]:80;     
    server_name red-line.live www.red-line.live;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name red-line.live www.red-line.live;
    
    ssl_certificate /etc/letsencrypt/live/red-line.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/red-line.live/privkey.pem;
    
    root /home/acserver/server/wwwroot;
    index index.html;
    
    # Disable caching for JSON files (dynamic data)
    location ~* \.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
    
    # Short cache for HTML (5 minutes)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    
    # Short cache for CSS/JS (5 minutes, can be overridden by ?v= query string)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    
    # Long cache for images (1 week)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    
    location / {
        try_files $uri $uri/ =404;
    }
}
